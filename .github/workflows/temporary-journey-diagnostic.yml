name: Temporary Journey Diagnostic
on:
  push:
    paths: ['.github/workflows/temporary-journey-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check health, stations and each journey without stopping on 404
        shell: bash
        run: |
          set -uo pipefail
          API="https://trains.nytnetwork.work/api/index.php"
          echo "== health =="
          curl -sS --max-time 12 "$API?action=health" | jq -c .
          station_id(){
            curl -sSG --max-time 12 "$API" --data-urlencode "action=stations" --data-urlencode "q=$1" | jq -r --arg n "$1" '.data[]?|select((.name|ascii_downcase)==($n|ascii_downcase))|.id'|head -1
          }
          for pair in "Hurstville|Kogarah" "Hurstville|Padstow" "Hurstville|Casula" "Chatswood|Gadigal"; do
            IFS='|' read -r from to <<<"$pair"
            fid="$(station_id "$from")"
            tid="$(station_id "$to")"
            echo "== $from to $to (station ids present? $([ -n "$fid" ] && echo yes || echo no), $([ -n "$tid" ] && echo yes || echo no)) =="
            [ -z "$fid" ] || [ -z "$tid" ] && continue
            for run in 1 2; do
              tmp="$(mktemp)"
              curl -sS --max-time 35 -G "$API" --data-urlencode "action=journey" --data-urlencode "from=$fid" --data-urlencode "to=$tid" --data-urlencode "fromName=$from" --data-urlencode "toName=$to" --data-urlencode "coreOnly=1" -o "$tmp" -w 'http=%{http_code} total=%{time_total} ttfb=%{time_starttransfer}\n'
              jq -c '{error:.error, route: (if .data then {legs:[.data.legs[]?|{line,origin:.origin.name,destination:.destination.name}],transfers:[.data.transfers[]?.name]} else null end)}' "$tmp"
              rm -f "$tmp"
            done
          done
