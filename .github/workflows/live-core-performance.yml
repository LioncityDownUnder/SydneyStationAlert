name: Live Core Performance
# second-pass
on:
  push:
    branches: [main]
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Measure core journey response
        shell: bash
        run: |
          set -euo pipefail
          API="https://trains.nytnetwork.work/api/index.php"
          station_id() {
            curl --fail --silent --show-error --get "$API"               --data-urlencode "action=stations"               --data-urlencode "q=$1" |
              jq -r --arg n "$1" '.data[] | select((.name|ascii_downcase)==($n|ascii_downcase)) | .id' |
              head -n1
          }
          FROM="$(station_id Hurstville)"
          for DEST in Padstow Casula; do
            TO="$(station_id "$DEST")"
            URL="$API?action=journey&from=$FROM&to=$TO&fromName=Hurstville&toName=$DEST&coreOnly=1"
            TMP="$(mktemp)"
            TIME="$(curl --fail --silent --show-error -o "$TMP" -w '%{time_total}' "$URL")"
            echo "$DEST core seconds: $TIME"
            jq '{source:.data.source,lines:[.data.legs[].line],transfers:[.data.transfers[].name],service:.data.serviceStatus.level,crowding:.data.crowding.available}' "$TMP"
          done
