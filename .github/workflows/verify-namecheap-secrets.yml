name: Verify Namecheap Secrets

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets exist
        env:
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PASSWORD: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          missing=0
          for name in NAMECHEAP_HOST NAMECHEAP_USERNAME NAMECHEAP_PASSWORD NAMECHEAP_PORT NAMECHEAP_DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              missing=1
            else
              echo "$name is present"
            fi
          done
          exit $missing
