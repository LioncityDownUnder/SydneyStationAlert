name: Investigate Airport Route (read-only)

on:
  pull_request:
    branches: [develop]
    paths:
      - "scripts/diagnose-airport-route.mjs"
      - "scripts/diagnose-airport-ui.mjs"
      - ".github/workflows/investigate-airport-route.yml"

jobs:
  live-api-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compare read-only QA and production journey APIs
        run: node scripts/diagnose-airport-route.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Reproduce journey search in real Chromium UI
        run: node scripts/diagnose-airport-ui.mjs
