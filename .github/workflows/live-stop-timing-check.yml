name: Live Stop Timing Check
on:
  push:
    paths:
      - '.github/workflows/live-stop-timing-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Hurstville to Sydenham stop times
        shell: bash
        run: |
          set -euo pipefail
          API="https://trains.nytnetwork.work/api/index.php"
          station_id() {
            curl --fail --silent --show-error --get "$API"               --data-urlencode "action=stations"               --data-urlencode "q=$1" |
              jq -r --arg n "$1" '.data[] | select((.name|ascii_downcase)==($n|ascii_downcase)) | .id' |
              head -n1
          }
          FROM="$(station_id Hurstville)"
          TO="$(station_id Sydenham)"
          curl --fail --silent --show-error --get "$API"             --data-urlencode "action=journey"             --data-urlencode "from=$FROM"             --data-urlencode "to=$TO"             --data-urlencode "fromName=Hurstville"             --data-urlencode "toName=Sydenham" |
            jq '.data.stops | map({name,arrival,departure,platform})'
