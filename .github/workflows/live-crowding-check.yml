name: Live Crowding Check
on:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live crowding
        shell: bash
        run: |
          set -euo pipefail
          API="https://trains.nytnetwork.work/api/index.php"
          station_id() {
            curl --fail --silent --show-error --get "$API"               --data-urlencode "action=stations"               --data-urlencode "q=$1" |
              jq -r --arg n "$1" '.data[] | select((.name|ascii_downcase)==($n|ascii_downcase)) | .id' |
              head -n1
          }
          FROM="$(station_id Waterloo)"
          TO="$(station_id Gadigal)"
          TMP="$(mktemp)"
          TIME="$(curl --fail --silent --show-error --get "$API"             --data-urlencode "action=journey"             --data-urlencode "from=$FROM"             --data-urlencode "to=$TO"             --data-urlencode "fromName=Waterloo"             --data-urlencode "toName=Gadigal"             -o "$TMP" -w '%{time_total}')"
          echo "seconds: $TIME"
          jq '{lines:[.data.legs[].line],tripIds:[.data.legs[].tripIds],crowding:.data.crowding,service:.data.serviceStatus.level}' "$TMP"
