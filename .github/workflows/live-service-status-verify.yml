name: Live Service Status Verify

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live journey transportation identifiers
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get             "https://trains.nytnetwork.work/api/index.php"             --data-urlencode "action=debug-trip-shape" |
            jq '[.data[] | {legs: [.legs[] | {transportation, origin: {id: .origin.id, name: .origin.name}, destination: {id: .destination.id, name: .destination.name}}]}]'
