name: Live Service Status Verify

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live alert affected structure
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get             "https://trains.nytnetwork.work/api/index.php"             --data-urlencode "action=debug-alert-shape" |
            jq '.data.alerts'
