name: QA Alert Reliability Notice Verification

on:
  push:
    branches: [feature/qa-collapsible-alert-reliability]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save typescript@5.9.3
      - run: npm run check
      - run: php tests/backend-test.php
