name: Verify QA Browser PR

on:
  pull_request:
    branches: [develop]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/qa-browser.mjs"
      - "scripts/qa-journey-browser.mjs"
      - ".github/workflows/deploy-qa.yml"
      - ".github/workflows/verify-qa-browser-pr.yml"
      - "package.json"
      - "tsconfig*.json"

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test tooling
        run: npm install --no-save typescript@5.9.3 playwright@1.56.1
      - name: Validate and build QA website
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mocked Chromium commuter scenarios
        run: |
          mkdir -p qa-site/qatest
          cp -R dist/. qa-site/qatest/
          python3 -m http.server 8765 --directory qa-site > /tmp/qa-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/qa-browser.mjs
          node scripts/qa-journey-browser.mjs
