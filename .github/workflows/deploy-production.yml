name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TypeScript
        run: npm install --no-save typescript@5.9.3

      - name: Run project checks
        run: npm run check

      - name: PHP syntax
        run: |
          php -l api/index.php
          php -l api/lib/core.php

      - name: PHP fixture tests
        run: php tests/backend-test.php

      - name: Remove QA-only administrative files from production artifact
        run: |
          rm -f dist/api/gtfs-update.php dist/api/gtfs-index.php
          test ! -e dist/api/gtfs-update.php
          test ! -e dist/api/gtfs-index.php
          test -f dist/api/lib/qa_route_rejections.php
          test ! -e dist/api/diagnostics.php
          test ! -e dist/diagnostics.html

      - name: Stamp release commit into deployment artifact
        run: |
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/release.json
          test -s dist/release.json

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist

      - name: Validate deployment secrets
        env:
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PASSWORD: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          test -n "$NAMECHEAP_HOST"
          test -n "$NAMECHEAP_USERNAME"
          test -n "$NAMECHEAP_PASSWORD"
          test -n "$NAMECHEAP_PORT"
          test -n "$NAMECHEAP_DEPLOY_PATH"

      - name: Install deployment tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Trust Namecheap SSH host
        env:
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$NAMECHEAP_PORT" "$NAMECHEAP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test Namecheap SSH connection
        env:
          SSHPASS: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          sshpass -e ssh -p "$NAMECHEAP_PORT" \
            -o StrictHostKeyChecking=yes \
            "$NAMECHEAP_USERNAME@$NAMECHEAP_HOST" \
            "test -d '$NAMECHEAP_DEPLOY_PATH'"

      - name: Deploy to Namecheap
        env:
          SSHPASS: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          sshpass -e rsync -az --delete \
            --exclude='/qatest/' \
            --exclude='api/config.local.php' \
            --exclude='api/cache/' \
            --exclude='*.log' \
            -e "ssh -p $NAMECHEAP_PORT -o StrictHostKeyChecking=yes" \
            dist/ \
            "$NAMECHEAP_USERNAME@$NAMECHEAP_HOST:$NAMECHEAP_DEPLOY_PATH/"

      - name: Verify deployed commit and production health
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://trains.nytnetwork.work"
          curl -fsS --retry 4 --retry-delay 4 --max-time 25 "$base/release.json" -o /tmp/production-release.json
          jq -e --arg sha "$EXPECTED_SHA" '.commit == $sha' /tmp/production-release.json
          curl -fsS --retry 3 --retry-delay 3 --max-time 25 "$base/api/index.php?action=health" -o /tmp/production-health.json
          jq -e '.data.ok == true and .data.configured == true' /tmp/production-health.json
          curl -fsS --retry 3 --retry-delay 3 --max-time 25 "$base/" -o /tmp/production-index.html
          grep -F 'Sydney Station Alert' /tmp/production-index.html
          curl -fsS --retry 3 --retry-delay 3 --max-time 25 "$base/assets/main.js" -o /tmp/production-main.js
          test -s /tmp/production-main.js
          curl -fsS --retry 3 --retry-delay 3 --max-time 25 "$base/api/index.php?action=stations&q=Parramatta" -o /tmp/production-stations.json
          jq -e '.data | type == "array"' /tmp/production-stations.json
          {
            echo "### Production smoke checks passed"
            echo "- Deployed commit matches $EXPECTED_SHA"
            echo "- API configured and healthy"
            echo "- Website, application bundle and station lookup available"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify QA staging survived production deployment
        run: |
          set -euo pipefail
          qa="https://trains.nytnetwork.work/qatest"
          curl -fsS --retry 3 --retry-delay 3 --max-time 25 "$qa/" -o /tmp/qa-index.html
          grep -F 'Sydney Station Alert' /tmp/qa-index.html
          curl -fsS --retry 3 --retry-delay 3 --max-time 25 "$qa/api/index.php?action=health" -o /tmp/qa-health.json
          jq -e '.data.ok == true and .data.configured == true' /tmp/qa-health.json
          echo "- QA site and API remained accessible" >> "$GITHUB_STEP_SUMMARY"
