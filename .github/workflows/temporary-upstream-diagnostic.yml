name: Temporary Upstream Path Diagnostic
on:
  push:
    paths:
      - '.github/workflows/temporary-upstream-diagnostic.yml'
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Trust SSH server
        env:
          H: ${{ secrets.NAMECHEAP_HOST }}
          P: ${{ secrets.NAMECHEAP_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$P" "$H" >> ~/.ssh/known_hosts
      - name: Inspect upstream journey metadata from production server
        env:
          SSHPASS: ${{ secrets.NAMECHEAP_PASSWORD }}
          H: ${{ secrets.NAMECHEAP_HOST }}
          P: ${{ secrets.NAMECHEAP_PORT }}
          U: ${{ secrets.NAMECHEAP_USERNAME }}
          ROOT: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          sshpass -e ssh -p "$P" -o StrictHostKeyChecking=yes "$U@$H" "cd '$ROOT' && php" < tests/temporary-upstream-diagnostic.php
