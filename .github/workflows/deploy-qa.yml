name: Deploy QA Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: qa-staging-deploy
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save typescript@5.9.3
      - run: npm run check
      - run: |
          php -l api/index.php
          php -l api/lib/core.php
          php tests/backend-test.php
      - uses: actions/upload-artifact@v4
        with:
          name: qa-dist
          path: dist/
          if-no-files-found: error

  deploy-qa:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qa-dist
          path: dist
      - name: Validate deployment secrets
        env:
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PASSWORD: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          test -n "$NAMECHEAP_HOST"
          test -n "$NAMECHEAP_USERNAME"
          test -n "$NAMECHEAP_PASSWORD"
          test -n "$NAMECHEAP_PORT"
          test -n "$NAMECHEAP_DEPLOY_PATH"
      - run: sudo apt-get update && sudo apt-get install -y sshpass rsync
      - name: Trust hosting SSH key
        env:
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$NAMECHEAP_PORT" "$NAMECHEAP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Prepare isolated QA directory and API key reference
        env:
          SSHPASS: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          sshpass -e ssh -p "$NAMECHEAP_PORT" -o StrictHostKeyChecking=yes \
            "$NAMECHEAP_USERNAME@$NAMECHEAP_HOST" \
            "test -f '$NAMECHEAP_DEPLOY_PATH/api/config.local.php' && mkdir -p '$NAMECHEAP_DEPLOY_PATH/qatest/api' && ln -sfn ../../api/config.local.php '$NAMECHEAP_DEPLOY_PATH/qatest/api/config.local.php'"
      - name: Deploy only into QA subdirectory
        env:
          SSHPASS: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          sshpass -e rsync -az --delete \
            --exclude='api/config.local.php' \
            --exclude='api/cache/' \
            --exclude='*.log' \
            -e "ssh -p $NAMECHEAP_PORT -o StrictHostKeyChecking=yes" \
            dist/ "$NAMECHEAP_USERNAME@$NAMECHEAP_HOST:$NAMECHEAP_DEPLOY_PATH/qatest/"
      - name: Verify QA API and page
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            "https://trains.nytnetwork.work/qatest/api/index.php?action=health" | tee /tmp/qa-health.json
          php -r '$v=json_decode(file_get_contents("/tmp/qa-health.json"),true); if(($v["data"]["ok"]??false)!==true || ($v["data"]["configured"]??false)!==true)exit(1);'
          curl --fail --silent --show-error "https://trains.nytnetwork.work/qatest/" -o /dev/null

      - name: Record QA core journey performance
        shell: bash
        run: |
          set -euo pipefail
          API="https://trains.nytnetwork.work/qatest/api/index.php"
          station_id() {
            curl --fail --silent --show-error --get "$API" --data-urlencode "action=stations" --data-urlencode "q=$1" |
              jq -r --arg n "$1" '.data[] | select((.name|ascii_downcase)==($n|ascii_downcase)) | .id' | head -n1
          }
          check_route() {
            local from="$1" to="$2" a b tmp time
            a="$(station_id "$from")"; b="$(station_id "$to")"; test -n "$a"; test -n "$b"
            tmp="$(mktemp)"
            time="$(curl --fail --silent --show-error --max-time 35 --get "$API" \
              --data-urlencode "action=journey" --data-urlencode "from=$a" --data-urlencode "to=$b" \
              --data-urlencode "fromName=$from" --data-urlencode "toName=$to" \
              --data-urlencode "coreOnly=1" -o "$tmp" -w '%{time_total}')"
            jq -e '.data.legs|length>=1' "$tmp" >/dev/null
            echo "$from to $to: ${time}s (5s target)"
            rm -f "$tmp"
          }
          check_route Hurstville Kogarah
          check_route Chatswood Gadigal
          check_route Hurstville Padstow
          check_route Hurstville Casula
