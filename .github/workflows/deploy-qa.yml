name: Deploy QA Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: qa-staging-deploy
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save typescript@5.9.3
      - run: npm run check
      - run: |
          php -l api/index.php
          php -l api/lib/core.php
          php -l api/lib/gtfs_diagnostic.php
          php -l api/lib/journey_builder.php
          php -l api/lib/journey_ranking.php
          php -l api/lib/journey_comparison.php
          php -l api/gtfs-update.php
          php -l api/gtfs-index.php
          php -l api/diagnostics.php
          php -l api/lib/qa_route_rejections.php
          php tests/backend-test.php
      - uses: actions/upload-artifact@v4
        with:
          name: qa-dist
          path: dist/
          if-no-files-found: error

  deploy-qa:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qa-dist
          path: dist
      - name: Validate deployment secrets
        env:
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PASSWORD: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          test -n "$NAMECHEAP_HOST"
          test -n "$NAMECHEAP_USERNAME"
          test -n "$NAMECHEAP_PASSWORD"
          test -n "$NAMECHEAP_PORT"
          test -n "$NAMECHEAP_DEPLOY_PATH"
      - run: sudo apt-get update && sudo apt-get install -y sshpass rsync
      - name: Trust hosting SSH key
        env:
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$NAMECHEAP_PORT" "$NAMECHEAP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Prepare isolated QA directory and API key reference
        env:
          SSHPASS: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          sshpass -e ssh -p "$NAMECHEAP_PORT" -o StrictHostKeyChecking=yes \
            "$NAMECHEAP_USERNAME@$NAMECHEAP_HOST" \
            "test -f '$NAMECHEAP_DEPLOY_PATH/api/config.local.php' && mkdir -p '$NAMECHEAP_DEPLOY_PATH/qatest/api' && ln -sfn ../../api/config.local.php '$NAMECHEAP_DEPLOY_PATH/qatest/api/config.local.php'"
      - name: Deploy only into QA subdirectory
        env:
          SSHPASS: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          sshpass -e rsync -az --delete \
            --exclude='api/config.local.php' \
            --exclude='api/cache/' \
            --exclude='*.log' \
            -e "ssh -p $NAMECHEAP_PORT -o StrictHostKeyChecking=yes" \
            dist/ "$NAMECHEAP_USERNAME@$NAMECHEAP_HOST:$NAMECHEAP_DEPLOY_PATH/qatest/"
      - name: Refresh private QA GTFS timetable
        env:
          SSHPASS: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          sshpass -e ssh -p "$NAMECHEAP_PORT" -o StrictHostKeyChecking=yes \
            "$NAMECHEAP_USERNAME@$NAMECHEAP_HOST" \
            "php '$NAMECHEAP_DEPLOY_PATH/qatest/api/gtfs-update.php'"

      - name: Build private QA GTFS index
        env:
          SSHPASS: ${{ secrets.NAMECHEAP_PASSWORD }}
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          sshpass -e ssh -p "$NAMECHEAP_PORT" -o StrictHostKeyChecking=yes \
            "$NAMECHEAP_USERNAME@$NAMECHEAP_HOST" \
            "php '$NAMECHEAP_DEPLOY_PATH/qatest/api/gtfs-index.php'"

      - name: Verify QA API and page
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            "https://trains.nytnetwork.work/qatest/api/index.php?action=health" | tee /tmp/qa-health.json
          php -r '$v=json_decode(file_get_contents("/tmp/qa-health.json"),true); if(($v["data"]["ok"]??false)!==true || ($v["data"]["configured"]??false)!==true)exit(1);'
          curl --fail --silent --show-error "https://trains.nytnetwork.work/qatest/" -o /dev/null


  verify-qa-browser:
    needs: deploy-qa
    if: always() && needs.deploy-qa.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qa-dist
          path: qa-site/qatest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify no-route display and retry in Chromium (mocked API)
        run: |
          python3 -m http.server 8765 --directory qa-site > /tmp/qa-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/qa-browser.mjs

  verify-qa-legacy-journeys:
    needs: [deploy-qa, verify-qa-diagnostics]
    if: always() && needs.deploy-qa.result == 'success' && needs.verify-qa-diagnostics.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Record QA core journey performance
        shell: bash
        run: |
          set -euo pipefail
          API="https://trains.nytnetwork.work/qatest/api/index.php"
          station_id() {
            curl --fail --silent --show-error --get "$API" --data-urlencode "action=stations" --data-urlencode "q=$1" |
              jq -r --arg n "$1" '.data[] | select((.name|ascii_downcase)==($n|ascii_downcase)) | .id' | head -n1
          }
          check_route() {
            local from="$1" to="$2" a b tmp time
            a="$(station_id "$from")"; b="$(station_id "$to")"; test -n "$a"; test -n "$b"
            tmp="$(mktemp)"
            local headers
            headers="$(mktemp)"
            local status
            echo "PROBE: $from to $to (coreOnly=1, 35s limit)"
            local started=$SECONDS curl_exit=0
            status="$(curl --silent --show-error --max-time 35 --dump-header "$headers" --get "$API" \
              --data-urlencode "action=journey" --data-urlencode "from=$a" --data-urlencode "to=$b" \
              --data-urlencode "fromName=$from" --data-urlencode "toName=$to" \
              --data-urlencode "coreOnly=1" -o "$tmp" -w '%{http_code}')" || curl_exit=$?
            echo "RESULT: $from to $to HTTP=$status curl_exit=$curl_exit elapsed=$((SECONDS-started))s"
            if [ "$curl_exit" = "28" ]; then
              echo "WARN: $from to $to: upstream/core journey request timed out at 35s"
              rm -f "$tmp" "$headers"
              return 0
            fi
            if [ "$curl_exit" != "0" ]; then
              echo "FAIL: $from to $to: curl exit $curl_exit"
              rm -f "$tmp" "$headers"
              return 1
            fi
            if [ "$status" = "503" ] && jq -e '.error.code=="SEARCH_TIME_LIMIT"' "$tmp" >/dev/null; then
              echo "WARN: $from to $to: QA search time budget reached; route availability unconfirmed"
              grep -i '^server-timing:' "$headers" || true
              grep -i '^x-qa-journey-search:' "$headers" || true
              rm -f "$tmp" "$headers"
              return 0
            fi
            if [ "$status" = "404" ] && jq -e '.error.code=="NO_ROUTE"' "$tmp" >/dev/null; then
              echo "WARN: $from to $to: no verified rail-only journey (NO_ROUTE); not an API outage"
              rm -f "$tmp" "$headers"
              return 0
            fi
            if [ "$status" != "200" ]; then
              echo "FAIL: $from to $to: unexpected HTTP $status"
              cat "$tmp"
              return 1
            fi
            time="$(grep -i '^server-timing:' "$headers" | head -n 1 || true)"
            jq -e '.data.legs|length>=1' "$tmp" >/dev/null
            # Check that every returned journey has a coherent stop/leg structure.
            jq -e '
              .data as $d |
              ($d.stops | type=="array" and length>=2) and
              ($d.legs | type=="array" and length>=1) and
              ($d.transfers | type=="array") and
              (all($d.legs[]; (.origin.id|type=="string") and (.destination.id|type=="string"))) and
              (($d.transfers|length) <= ($d.legs|length)-1)
            ' "$tmp" >/dev/null
            # If the first parallel batch found a route, no extra probe should run.
            if grep -qi '^x-qa-journey-search:.*initial_route_found=1' "$headers"; then
              grep -qi '^x-qa-journey-search:.*additional_probes=0' "$headers"
            fi
            echo "$from to $to: valid journey returned"
            grep -i '^server-timing:' "$headers" || true
            grep -i '^x-qa-journey-search:' "$headers" || true
            rm -f "$tmp" "$headers"
          }
          check_route Hurstville Kogarah
          check_route Chatswood Gadigal
          check_route Hurstville Padstow
          check_route Hurstville Casula

  verify-qa-diagnostics:
    needs: deploy-qa
    if: always() && needs.deploy-qa.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed QA diagnostics
        id: verify
        continue-on-error: true
        run: python3 scripts/qa-smoke-light.py
      - name: Step 5AG bounded four-route rail-filter diagnostic smoke
        run: |
          mkdir -p qa-verification
          curl --fail --silent --show-error --max-time 30 "https://trains.nytnetwork.work/qatest/api/diagnostics.php?action=probe_rail_search_four_routes" -o qa-verification/step5ag-four-route-filter.json
          jq -e '.data.mode=="QA_FILTERED_DIAGNOSTIC_ONLY" and .data.requestCount==4 and (.data.routes | length)==4 and (.data.routes | all(.[]; .status=="RAIL_CANDIDATE_UNVERIFIED" or .status=="NO_RAIL_CANDIDATE_IN_RESPONSE" or .status=="UPSTREAM_UNAVAILABLE"))' qa-verification/step5ag-four-route-filter.json >/dev/null
          jq -c '.data | {elapsedMs, requestCount, routes: (.routes | with_entries(.value |= {status,rawJourneys,railOnlyNormalized}))}' qa-verification/step5ag-four-route-filter.json
      - name: Optional Step 5AD route rejection evidence (manual only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          mkdir -p qa-verification
          curl --fail --silent --show-error --max-time 30 "https://trains.nytnetwork.work/qatest/api/diagnostics.php?action=probe_route_rejections" -o qa-verification/step5ad-route-rejections.json
          python3 -m json.tool qa-verification/step5ad-route-rejections.json > /dev/null
      - name: Optional extended TfNSW investigation (manual only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python3 scripts/qa-verify.py
      - name: Upload QA diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostic-evidence
          path: qa-verification/
          if-no-files-found: warn
      - name: Add verification summary
        if: always()
        run: |
          if test -f qa-verification/summary.md; then cat qa-verification/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Fail workflow when verification fails
        if: steps.verify.outcome == 'failure'
        run: exit 1
