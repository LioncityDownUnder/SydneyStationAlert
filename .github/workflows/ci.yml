name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save typescript@5.9.3
      - run: npm run check
      - name: PHP syntax
        run: |
          php -l api/index.php
          php -l api/lib/core.php
      - name: PHP fixture tests
        run: php tests/backend-test.php
