name: Verify QA Selected Train Crowding

on:
  push:
    branches: [fix/qa-selected-train-crowding]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install TypeScript
        run: npm install --no-save typescript@5.9.3
      - name: Frontend and regression tests
        run: npm run check
      - name: PHP syntax and backend tests
        run: |
          find api -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/backend-test.php
      - name: Assert crowding API remains optional
        run: |
          grep -F "if(\$action==='crowding')" api/index.php
          grep -F 'selectedCrowdingIdentity(state.journey)!==identity' src/main.ts
          grep -F 'Crowding data unavailable for this service' src/main.ts
