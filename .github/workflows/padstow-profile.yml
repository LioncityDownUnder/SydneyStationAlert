name: Padstow Profile
on:
  push:
    paths:
      - '.github/workflows/padstow-profile.yml'
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Profile production route
        shell: bash
        run: |
          set -euo pipefail
          API="https://trains.nytnetwork.work/api/index.php"
          station_id() {
            curl --fail --silent --show-error --get "$API"               --data-urlencode "action=stations"               --data-urlencode "q=$1" |
              jq -r --arg n "$1" '.data[] | select((.name|ascii_downcase)==($n|ascii_downcase)) | .id' |
              head -n1
          }
          FROM="$(station_id Hurstville)"
          TO="$(station_id Padstow)"
          for COUNT in 10 14 18 22; do
            echo "== trip count $COUNT =="
            TMP="$(mktemp)"
            curl --fail --silent --show-error --get "$API"               --data-urlencode "action=journey"               --data-urlencode "from=$FROM"               --data-urlencode "to=$TO"               --data-urlencode "fromName=Hurstville"               --data-urlencode "toName=Padstow"               --data-urlencode "coreOnly=1"               --data-urlencode "debugTiming=1"               --data-urlencode "debugTripCount=$COUNT"               -o "$TMP" -w 'total=%{time_total}\n'
            jq '{source:.data.source,lines:[.data.legs[].line],transfers:[.data.transfers[].name],timing:.data._debugTiming}' "$TMP"
            rm -f "$TMP"
          done
